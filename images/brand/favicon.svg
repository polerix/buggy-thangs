<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Buggy-Thangs mark</title>
  <!-- Peace hand: eyestalks = V fingers (left of centre), knuckles of curled fingers on the right, lips = thumb angled up across the fist -->
  <defs>
    <g id="eye">
      <circle r="7.6" fill="#FFFFFF"/>
      <circle cx="0.4" cy="2.4" r="2.8" fill="#1B1712"/>
      <circle cx="-0.5" cy="1.5" r="0.9" fill="#FFFFFF"/>
      <path d="M-7.6 0 A7.6 7.6 0 0 1 7.6 0 Q0 3.4 -7.6 0 Z" fill="#F08FA0"/>
      <path d="M-7.6 0 Q0 3.4 7.6 0" fill="none" stroke="#1B1712" stroke-width="1.8"/>
      <circle r="7.6" fill="none" stroke="#1B1712" stroke-width="3"/>
    </g>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- fingers -->
    <path d="M24 41 L15 11" stroke="#1B1712" stroke-width="13" fill="none"/>
    <path d="M33 41 L42 10" stroke="#1B1712" stroke-width="13" fill="none"/>
    <path d="M24 41 L15 11" stroke="#C23B22" stroke-width="7.5" fill="none"/>
    <path d="M33 41 L42 10" stroke="#C23B22" stroke-width="7.5" fill="none"/>
    <path d="M24 41 L15 11" stroke="#F0B230" stroke-width="7.5" stroke-dasharray="4.5 4.5" stroke-dashoffset="2" stroke-linecap="butt" fill="none"/>
    <path d="M33 41 L42 10" stroke="#F0B230" stroke-width="7.5" stroke-dasharray="4.5 4.5" stroke-dashoffset="2" stroke-linecap="butt" fill="none"/>

    <!-- fist: smooth top-left behind the V, two knuckle bumps top-right -->
    <path d="M15 48 C14.5 41 17 37.5 21 36.5 C25 35.2 31 35.2 35 36 C36.5 33.4 40.2 33.4 41.6 35.6 C43.6 34 47.2 35.2 47.6 38.2 C49.8 40.2 50.2 43.8 49.7 48 C49.2 56.6 44 62 32.5 62 C21 62 15.5 57 15 48 Z"
          fill="#6E8B2F" stroke="#1B1712" stroke-width="3"/>
    <path d="M18.5 45 C18.5 41 20.5 39.4 23 39 C26.5 38.4 29.5 38.6 31.5 39 C27 40.6 22.5 42.4 18.5 45 Z" fill="#93B048"/>
    <path d="M46.5 45 C47 53 43.5 58.4 36 59.2 C42 56.2 45 51.6 46.5 45 Z" fill="#4A6420"/>
    <!-- knuckle creases -->
    <path d="M41.5 38 L41 40.5" stroke="#4A6420" stroke-width="1.8" fill="none"/>

    <!-- lips = thumb, angled up toward the curled fingers -->
    <g transform="rotate(-12 31 51)">
      <path d="M16.5 51 C18 46 24 45 29.5 47.5 C35 45 41 46 42.5 51 C39.5 57 19.5 57 16.5 51 Z"
            fill="#EE8E6E" stroke="#1B1712" stroke-width="2.4"/>
      <path d="M17.5 51 C24 52.3 35 52.3 41.5 51" fill="none" stroke="#1B1712" stroke-width="1.9"/>
      <path d="M31.5 52.2 C31.5 55.6 33 57.4 34.8 57.4 C36.6 57.4 37.6 55.6 37.2 52 Z" fill="#D86F8A" stroke="#1B1712" stroke-width="1.7"/>
    </g>

    <!-- eyes = fingertips -->
    <use href="#eye" x="14.5" y="10" transform="rotate(-8 14.5 10)"/>
    <use href="#eye" x="42.5" y="9.5" transform="rotate(8 42.5 9.5)"/>
  </g>
</svg>
